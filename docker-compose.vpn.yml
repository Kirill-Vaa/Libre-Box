services:
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: libre-box-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      FIREWALL: "on"
      FIREWALL_INPUT_PORTS: "8931"
    volumes:
      - ./vpn/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://ifconfig.me"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      app:
        aliases:
          - playwright
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  sandbox:
    networks: !reset null
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy

  playwright:
    networks: !reset null
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy