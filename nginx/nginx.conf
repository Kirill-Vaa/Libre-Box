worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    types_hash_max_size  2048;
    server_tokens        off;
    client_max_body_size 1024m;

    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  5;
    gzip_min_length  256;
    gzip_types       text/css application/javascript application/json application/manifest+json image/svg+xml;

    keepalive_timeout  65;
    keepalive_requests 1000;

    client_body_timeout       60s;
    client_header_timeout     15s;
    send_timeout              60s;
    reset_timedout_connection on;

    log_format main_format
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main_format;

    limit_req_zone  $binary_remote_addr zone=req_general:16m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=req_login:8m    rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:16m;
    limit_req_status  429;
    limit_conn_status 429;

    resolver 127.0.0.11 ipv6=off valid=30s;

    map $http_upgrade $connection_upgrade {
        default "upgrade";
        ""      "close";
    }

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/conf.d/*.conf;
}